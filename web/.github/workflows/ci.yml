name: CI

on:
  push:
    branches:
      - feat/web-dashboard
  pull_request:
    branches:
      - feat/web-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint
        working-directory: ./web
        run: npm run lint --if-present

      - name: Build
        working-directory: ./web
        run: npm run build
