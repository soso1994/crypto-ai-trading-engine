name: Test Matrix

on:
  push:
    branches:
      - feat/web-dashboard
  pull_request:
    branches:
      - feat/web-dashboard

jobs:
  web_tests:
    name: Web (Node) Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install and Build
        working-directory: ./web
        run: |
          npm ci
          npm run build
      - name: Run lint
        working-directory: ./web
        run: npm run lint --if-present

  python_tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run pytest (backtester)
        working-directory: ./tools/backtester
        run: pytest -q
